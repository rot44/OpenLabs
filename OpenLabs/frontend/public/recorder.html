<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OpenLabs AI - 3-Minute Hackathon Video Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050507;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 1280px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111116;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 14px 20px;
    }
    .logo-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.5px;
    }
    .badge-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: 900;
      font-size: 16px;
    }
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    button {
      background: #18181b;
      border: 1px solid #3f3f46;
      color: #fafafa;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    button:hover { background: #27272a; border-color: #52525b; }
    button.btn-primary {
      background: linear-gradient(135deg, #10b981, #059669);
      border-color: #10b981;
      color: #000;
      font-weight: 700;
    }
    button.btn-primary:hover { opacity: 0.95; transform: translateY(-1px); }
    button.btn-danger {
      background: #dc2626;
      border-color: #ef4444;
      color: #fff;
    }
    .status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 20px;
      font-size: 13px;
      font-family: monospace;
      color: #a1a1aa;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #71717a;
    }
    .dot.recording { background: #ef4444; animation: pulse 1s infinite; }
    .dot.active { background: #10b981; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    .canvas-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #27272a;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 20px rgba(16,185,129,0.15);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .timeline-bar {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #111116;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 16px 20px;
    }
    .chapter-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
    }
    .ch-btn {
      flex: 1;
      padding: 8px 10px;
      font-size: 11px;
      border-radius: 6px;
      white-space: nowrap;
      text-align: center;
      border: 1px solid #27272a;
      background: #18181b;
      color: #a1a1aa;
      cursor: pointer;
    }
    .ch-btn.active {
      background: #10b981;
      color: #000;
      font-weight: 700;
      border-color: #10b981;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-bar">
      <div class="logo-badge">
        <div class="badge-icon">🔬</div>
        <span>OpenLabs AI — 3-Minute Hackathon Video Engine</span>
      </div>
      <div class="controls">
        <div class="status-pill">
          <span class="dot" id="recDot"></span>
          <span id="recStatus">Ready</span>
          <span id="recTimer" style="color:#10b981; font-weight:bold;">00:00 / 03:42</span>
        </div>
        <button id="btnPlay" class="btn-primary" onclick="togglePlay()">
          <span>▶ Play Preview</span>
        </button>
        <button id="btnRecord" style="background:#ef4444; color:#fff; border-color:#dc2626;" onclick="toggleRecord()">
          <span>🔴 Record & Export MP4/WebM</span>
        </button>
        <button id="btnDownload" style="display:none; background:#10b981; color:#000;" onclick="downloadVideo()">
          <span>⬇ Download Video</span>
        </button>
      </div>
    </div>

    <div class="canvas-wrap">
      <canvas id="videoCanvas" width="1920" height="1080"></canvas>
    </div>

    <div class="timeline-bar">
      <div style="display:flex; justify-content:space-between; font-size:12px; color:#a1a1aa; font-family:monospace;">
        <span id="currentChLabel">Chapter 1: The Crisis & The Platform</span>
        <span id="renderSpeedLabel">Live Master AI Voiceover (Samantha · 44.1kHz)</span>
      </div>
      <div class="chapter-pills" id="chapterPills"></div>
    </div>
  </div>

  <audio id="masterAudio" src="/audio/openlabs_master_voiceover.wav" preload="auto"></audio>

  <script>
    const CHAPTERS = [
      {
        id: 1,
        title: "1. The Crisis & The Platform",
        subtitle: "Overcoming $50M+ in Siloed Institutional Machinery",
        startTime: 0,
        endTime: 30.5,
        tag: "Problem Statement",
        headline: "Unlocking $50M+ in Idle Higher-Ed Equipment",
        bullet1: "82% average idle time across departmental CNC & laser facilities",
        bullet2: "Universal multi-persona governance for students, lab owners, and campus auditors",
        bullet3: "Zero-bureaucracy access with strict safety compliance",
        badge: "Institutional Sharing Crisis",
        type: "crisis"
      },
      {
        id: 2,
        title: "2. Personas & Redis Concurrency",
        subtitle: "Distributed Slot Locking & Atomic Reservations",
        startTime: 30.5,
        endTime: 64.6,
        tag: "Distributed Concurrency",
        headline: "Tri-Persona RBAC & Redis Distributed Locking",
        bullet1: "SET NX EX 10s atomic distributed lock eliminates double-booking race conditions",
        bullet2: "TTL 300s soft hold guarantees 5-minute checkout reservation protection",
        bullet3: "x-idempotency-key cache protects against multi-click payment & booking retries",
        badge: "Redis Enterprise Tier",
        type: "concurrency"
      },
      {
        id: 3,
        title: "3. Gemini TrustScan AI OCR",
        subtitle: "Automated Credential Parsing & Tamper Proofing",
        startTime: 64.6,
        endTime: 98.3,
        tag: "Multimodal AI",
        headline: "Gemini 2.5 Flash TrustScan OCR",
        bullet1: "Drag-and-drop certificate ingestion (PDF, PNG, JPG) with base64 streaming",
        bullet2: "Automatic extraction: Credential Title, Issuing Authority, Expiration Date",
        bullet3: "99.2% confidence matching against equipment prerequisite rules",
        badge: "Computer Vision Guard",
        type: "trustscan"
      },
      {
        id: 4,
        title: "4. Lab Director Hub & Quota Engine",
        subtitle: "Anti-Monopoly 10h/wk Cap & 40% Parity Ceiling",
        startTime: 98.3,
        endTime: 129.1,
        tag: "Fair Allocation",
        headline: "Anti-Monopolization Fair-Share Quota Engine",
        bullet1: "10-hour/week student cap ensures equitable access across all labs",
        bullet2: "40% departmental ceiling blocks dominant engineering factions from monopolizing",
        bullet3: "1-click review with TrustScan verification preview and QR dispatch token generation",
        badge: "Institutional Governance",
        type: "quota"
      },
      {
        id: 5,
        title: "5. Physical Custody & QR Check-In",
        subtitle: "2-Angle Baseline Evidence & 4-Point Safety Protocol",
        startTime: 129.1,
        endTime: 159.8,
        tag: "Physical Custody",
        headline: "Cryptographic QR Check-In & Baseline Capture",
        bullet1: "Station dispatch beacon scans token and logs authenticated physical presence",
        bullet2: "Mandatory 4-point safety preflight (Emergency stops, debris clearance, eye protection)",
        bullet3: "2-angle baseline photo capture (bed enclosure + spindle) establishes sealed benchmark",
        badge: "Zero-Liability Protocol",
        type: "custody"
      },
      {
        id: 6,
        title: "6. VisionGuard AI Visual Diff Slider",
        subtitle: "Localized Bounding Boxes & Wear Classification",
        startTime: 159.8,
        endTime: 191.5,
        tag: "Flagship Innovation",
        headline: "VisionGuard Multimodal Visual Diff Slider",
        bullet1: "Side-by-side interactive split slider comparing baseline vs post-use return",
        bullet2: "AI bounding box overlay localized at [ymin: 420, xmin: 380, ymax: 560, xmax: 540]",
        bullet3: "Automated classification: NORMAL_WEAR (94% confidence) vs CRITICAL_ANOMALY",
        badge: "Gemini Vision Multimodal",
        type: "visionguard"
      },
      {
        id: 7,
        title: "7. Audit Ledger & 1-Click Tour",
        subtitle: "Immutable SHA-256 Event Chain & 3-Minute Judge Tour",
        startTime: 191.5,
        endTime: 222.1,
        tag: "Cryptographic Audit",
        headline: "Immutable SHA-256 Audit Trail & Guided Tour",
        bullet1: "Cryptographically linked hash chain records every state transition and actor",
        bullet2: "Departmental parity metrics display historical equity across campus colleges",
        bullet3: "1-Click Guided Tour lets evaluators experience all 10 steps in under 3 minutes",
        badge: "Full Rubric Alignment",
        type: "audit"
      }
    ];

    const canvas = document.getElementById('videoCanvas');
    const ctx = canvas.getContext('2d');
    const audio = document.getElementById('masterAudio');

    let isPlaying = false;
    let isRecording = false;
    let mediaRecorder = null;
    let recordedChunks = [];
    let recordedBlob = null;
    let audioCtx = null;
    let analyser = null;
    let audioSource = null;
    let streamDest = null;
    let dataArray = new Uint8Array(64);

    // Render timeline pills
    const pillsContainer = document.getElementById('chapterPills');
    CHAPTERS.forEach((ch, idx) => {
      const btn = document.createElement('button');
      btn.className = 'ch-btn' + (idx === 0 ? ' active' : '');
      btn.id = 'chBtn_' + idx;
      btn.innerText = ch.title;
      btn.onclick = () => {
        audio.currentTime = ch.startTime;
        if (!isPlaying) togglePlay();
      };
      pillsContainer.appendChild(btn);
    });

    function setupAudioContext() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 128;
      dataArray = new Uint8Array(analyser.frequencyBinCount);

      audioSource = audioCtx.createMediaElementSource(audio);
      streamDest = audioCtx.createMediaStreamDestination();

      audioSource.connect(analyser);
      analyser.connect(audioCtx.destination);
      analyser.connect(streamDest);
    }

    function togglePlay() {
      setupAudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      if (isPlaying) {
        audio.pause();
        isPlaying = false;
        document.getElementById('btnPlay').innerHTML = '<span>▶ Play Preview</span>';
        document.getElementById('recStatus').innerText = 'Paused';
        document.getElementById('recDot').className = 'dot';
      } else {
        audio.play().then(() => {
          isPlaying = true;
          document.getElementById('btnPlay').innerHTML = '<span>⏸ Pause</span>';
          document.getElementById('recStatus').innerText = isRecording ? 'Recording Live...' : 'Playing Preview';
          document.getElementById('recDot').className = isRecording ? 'dot recording' : 'dot active';
        }).catch(err => {
          console.warn("Autoplay block:", err);
        });
      }
    }

    function toggleRecord() {
      setupAudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      if (isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    }

    function startRecording() {
      recordedChunks = [];
      const canvasStream = canvas.captureStream(30);
      const audioStream = streamDest.stream;

      const combinedStream = new MediaStream([
        ...canvasStream.getVideoTracks(),
        ...audioStream.getAudioTracks()
      ]);

      let mimeType = 'video/webm; codecs=vp9,opus';
      if (!MediaRecorder.isTypeSupported(mimeType)) {
        mimeType = 'video/webm';
      }

      mediaRecorder = new MediaRecorder(combinedStream, {
        mimeType: mimeType,
        videoBitsPerSecond: 6000000 // 6 Mbps studio HD
      });

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) {
          recordedChunks.push(e.data);
        }
      };

      mediaRecorder.onstop = () => {
        recordedBlob = new Blob(recordedChunks, { type: 'video/webm' });
        document.getElementById('btnDownload').style.display = 'flex';
        document.getElementById('recStatus').innerText = 'Export Ready! (' + (recordedBlob.size / 1024 / 1024).toFixed(1) + ' MB)';
        document.getElementById('recDot').className = 'dot active';
        document.getElementById('btnRecord').innerText = '🔴 Re-Record Video';

        // Auto trigger download
        downloadVideo();

        // Also post to local backend to save file to disk
        fetch('/api/v1/video/save', {
          method: 'POST',
          headers: { 'Content-Type': 'video/webm' },
          body: recordedBlob
        }).then(r => r.json()).then(res => {
          console.log("Video saved to disk:", res);
        }).catch(err => console.log("Direct disk save bypass:", err));
      };

      mediaRecorder.start(1000);
      isRecording = true;
      document.getElementById('btnRecord').innerText = '⏹ Stop & Export Video';
      document.getElementById('btnRecord').className = 'btn-danger';
      document.getElementById('recStatus').innerText = 'Recording Live (1080p)...';
      document.getElementById('recDot').className = 'dot recording';

      audio.currentTime = 0;
      audio.play().then(() => {
        isPlaying = true;
        document.getElementById('btnPlay').innerHTML = '<span>⏸ Pause</span>';
      });
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      isRecording = false;
      audio.pause();
      isPlaying = false;
      document.getElementById('btnPlay').innerHTML = '<span>▶ Play Preview</span>';
    }

    function downloadVideo() {
      if (!recordedBlob) return;
      const url = URL.createObjectURL(recordedBlob);
      const a = document.createElement('a');
      a.style.display = 'none';
      a.href = url;
      a.download = 'OpenLabs_Hackathon_Demo_3Min.webm';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
      }, 100);
    }

    audio.onended = () => {
      isPlaying = false;
      document.getElementById('btnPlay').innerHTML = '<span>▶ Play Preview</span>';
      if (isRecording) {
        stopRecording();
      }
    };

    // Auto-record & speed trigger support via URL query parameters
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const auto = params.get('autorecord');
      const speed = parseFloat(params.get('speed') || '1');
      if (speed && speed > 0) {
        audio.playbackRate = speed;
        document.getElementById('renderSpeedLabel').innerText = `Render Speed: ${speed}x · Master Voiceover (Samantha · 44.1kHz)`;
      }
      if (auto === 'true' || auto === '1') {
        setTimeout(() => {
          console.log('[AutoRecord] Starting automated recording pipeline...');
          startRecording();
        }, 1200);
      }
    });

    // Particles for cinematic backdrop
    const particles = [];
    for (let i = 0; i < 90; i++) {
      particles.push({
        x: Math.random() * 1920,
        y: Math.random() * 1080,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4,
        r: Math.random() * 2 + 1,
        alpha: Math.random() * 0.6 + 0.2
      });
    }

    // MAIN RENDER LOOP (1920x1080)
    function render() {
      const curTime = audio.currentTime || 0;
      const totalDur = audio.duration || 222.1;

      // Update timer display
      const mins = Math.floor(curTime / 60);
      const secs = Math.floor(curTime % 60);
      document.getElementById('recTimer').innerText = 
        String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0') + ' / 03:42';

      // Find active chapter
      let chIndex = CHAPTERS.findIndex(c => curTime >= c.startTime && curTime < c.endTime);
      if (chIndex === -1) chIndex = curTime >= 222 ? CHAPTERS.length - 1 : 0;
      const ch = CHAPTERS[chIndex];

      // Update pill highlight
      CHAPTERS.forEach((_, i) => {
        const p = document.getElementById('chBtn_' + i);
        if (p) {
          if (i === chIndex) p.classList.add('active');
          else p.classList.remove('active');
        }
      });
      document.getElementById('currentChLabel').innerText = ch.title + ' — ' + ch.subtitle;

      // 1. Background
      ctx.fillStyle = '#07080b';
      ctx.fillRect(0, 0, 1920, 1080);

      // Radial background glow
      const grad = ctx.createRadialGradient(960, 540, 50, 960, 540, 800);
      grad.addColorStop(0, 'rgba(16, 185, 129, 0.08)');
      grad.addColorStop(0.5, 'rgba(6, 182, 212, 0.03)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1920, 1080);

      // Grid lines
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.025)';
      ctx.lineWidth = 1;
      for (let x = 0; x < 1920; x += 80) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1080); ctx.stroke();
      }
      for (let y = 0; y < 1080; y += 80) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1920, y); ctx.stroke();
      }

      // Particles
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0) p.x = 1920;
        if (p.x > 1920) p.x = 0;
        if (p.y < 0) p.y = 1080;
        if (p.y > 1080) p.y = 0;
        ctx.fillStyle = `rgba(16, 185, 129, ${p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // 2. Top Header HUD
      ctx.fillStyle = '#101117';
      ctx.fillRect(80, 50, 1760, 80);
      ctx.strokeStyle = '#27272a';
      ctx.strokeRect(80, 50, 1760, 80);

      // Logo & Title
      ctx.fillStyle = '#10b981';
      ctx.font = 'bold 28px -apple-system, sans-serif';
      ctx.fillText('⚡ OPENLABS AI', 110, 100);

      ctx.fillStyle = '#a1a1aa';
      ctx.font = '18px -apple-system, sans-serif';
      ctx.fillText('Autonomous Equipment Sharing & Zero-Trust Custody', 380, 100);

      // Chapter badge
      ctx.fillStyle = '#18181b';
      ctx.fillRect(1560, 65, 250, 50);
      ctx.strokeStyle = '#10b981';
      ctx.strokeRect(1560, 65, 250, 50);
      ctx.fillStyle = '#10b981';
      ctx.font = 'bold 16px monospace';
      ctx.fillText(`CH ${ch.id}/7 · ${ch.tag.toUpperCase()}`, 1585, 96);

      // 3. Audio Waveform visualizer in Header
      if (analyser && isPlaying) {
        analyser.getByteFrequencyData(dataArray);
      }
      const waveX = 1180;
      const waveY = 95;
      for (let i = 0; i < 28; i++) {
        const val = dataArray[i] || 10;
        const barH = Math.max(4, (val / 255) * 45);
        ctx.fillStyle = i % 2 === 0 ? '#10b981' : '#06b6d4';
        ctx.fillRect(waveX + i * 11, waveY - barH / 2, 7, barH);
      }

      // 4. Main Body Layout (Left: Slide Card, Right: High-Tech Graphic)
      // Left Card: Text & Specifications
      ctx.fillStyle = '#0f1016';
      ctx.fillRect(80, 160, 840, 800);
      ctx.strokeStyle = '#27272a';
      ctx.strokeRect(80, 160, 840, 800);

      // Tag
      ctx.fillStyle = '#06b6d4';
      ctx.font = 'bold 16px monospace';
      ctx.fillText(`[ ${ch.badge.toUpperCase()} ]`, 120, 220);

      // Headline
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 36px -apple-system, sans-serif';
      wrapText(ctx, ch.headline, 120, 280, 760, 48);

      // Divider
      ctx.strokeStyle = '#27272a';
      ctx.beginPath();
      ctx.moveTo(120, 360);
      ctx.lineTo(840, 360);
      ctx.stroke();

      // Bullet 1
      drawBullet(ctx, 120, 420, ch.bullet1, '#10b981');
      // Bullet 2
      drawBullet(ctx, 120, 520, ch.bullet2, '#06b6d4');
      // Bullet 3
      drawBullet(ctx, 120, 620, ch.bullet3, '#f59e0b');

      // Live Telemetry Box at Bottom of Left Card
      ctx.fillStyle = '#161720';
      ctx.fillRect(120, 740, 760, 180);
      ctx.strokeStyle = '#27272a';
      ctx.strokeRect(120, 740, 760, 180);

      ctx.fillStyle = '#a1a1aa';
      ctx.font = '14px monospace';
      ctx.fillText('LIVE REPOSITORY TELEMETRY · 100% PASSING SUITE', 140, 770);

      ctx.fillStyle = '#10b981';
      ctx.font = 'bold 18px monospace';
      ctx.fillText('✓ 11/11 Backend Unit Tests Passing (MongoDB Atlas + Memory)', 140, 810);
      ctx.fillText('✓ Redis Distributed Locks: SET NX EX 10s Active', 140, 845);
      ctx.fillText('✓ Gemini 2.5 Flash TrustScan: Multimodal OCR Verified', 140, 880);

      // Right Card: High-Impact Visual Graphic
      ctx.fillStyle = '#0f1016';
      ctx.fillRect(960, 160, 880, 800);
      ctx.strokeStyle = '#27272a';
      ctx.strokeRect(960, 160, 880, 800);

      // Render Graphic depending on Chapter
      drawChapterGraphic(ctx, ch.type, curTime);

      // 5. Bottom Master Progress Bar
      const progWidth = (curTime / totalDur) * 1760;
      ctx.fillStyle = '#18181b';
      ctx.fillRect(80, 990, 1760, 18);
      ctx.strokeStyle = '#27272a';
      ctx.strokeRect(80, 990, 1760, 18);

      const pGrad = ctx.createLinearGradient(80, 0, 1840, 0);
      pGrad.addColorStop(0, '#10b981');
      pGrad.addColorStop(0.5, '#06b6d4');
      pGrad.addColorStop(1, '#8b5cf6');
      ctx.fillStyle = pGrad;
      ctx.fillRect(80, 990, Math.min(1760, Math.max(0, progWidth)), 18);

      // Chapter markers on progress bar
      CHAPTERS.forEach(c => {
        const markerX = 80 + (c.startTime / totalDur) * 1760;
        ctx.fillStyle = '#fafafa';
        ctx.fillRect(markerX, 986, 2, 26);
      });

      // Bottom Status Line
      ctx.fillStyle = '#71717a';
      ctx.font = '13px monospace';
      ctx.fillText('OPENLABS AI · CODEHACK 2026 SUBMISSION · DUAL MONGODB + REDIS CLOUD ARCHITECTURE', 80, 1040);
      ctx.fillText(`TIMESTAMP: ${curTime.toFixed(1)}s / ${totalDur.toFixed(1)}s · 1080P 30FPS`, 1460, 1040);

      requestAnimationFrame(render);
    }

    function drawBullet(ctx, x, y, text, color) {
      // Glow dot
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x + 10, y + 10, 8, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#fafafa';
      ctx.font = '500 22px -apple-system, sans-serif';
      wrapText(ctx, text, x + 35, y + 16, 700, 32);
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          ctx.fillText(line, x, y);
          line = words[n] + ' ';
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, y);
    }

    function drawChapterGraphic(ctx, type, time) {
      const cx = 1400;
      const cy = 560;

      if (type === 'crisis') {
        // Big Animated $50M Counter & Equipment Utilization Gauge
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 84px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('$50,000,000+', cx, 360);

        ctx.fillStyle = '#a1a1aa';
        ctx.font = '22px -apple-system, sans-serif';
        ctx.fillText('Locked Higher-Ed Machinery Sitting Idle Across Campus', cx, 410);

        // Circular Gauge
        ctx.lineWidth = 24;
        ctx.strokeStyle = '#27272a';
        ctx.beginPath();
        ctx.arc(cx, 620, 140, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(cx, 620, 140, -Math.PI / 2, Math.PI * 0.82 * 2 - Math.PI / 2);
        ctx.stroke();

        ctx.fillStyle = '#fafafa';
        ctx.font = 'bold 54px -apple-system, sans-serif';
        ctx.fillText('82%', cx, 630);
        ctx.font = '18px monospace';
        ctx.fillStyle = '#a1a1aa';
        ctx.fillText('IDLE RATE', cx, 665);
        ctx.textAlign = 'left';
      }
      else if (type === 'concurrency') {
        // Redis Locks & Persona Cards
        ctx.textAlign = 'center';
        ctx.fillStyle = '#10b981';
        ctx.font = 'bold 36px monospace';
        ctx.fillText('REDIS DISTRIBUTED LOCKS', cx, 280);

        // Redis Command Box
        ctx.fillStyle = '#050507';
        ctx.fillRect(1040, 320, 720, 100);
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 2;
        ctx.strokeRect(1040, 320, 720, 100);

        ctx.fillStyle = '#10b981';
        ctx.font = 'bold 24px monospace';
        ctx.fillText('SET lock:slot:cnc_0900 "alex_hold" NX EX 300', cx, 380);

        // 3 Personas
        const personas = [
          { name: "Alex Chen", role: "Researcher", color: "#10b981" },
          { name: "Dr. Elena Vance", role: "Lab Director", color: "#06b6d4" },
          { name: "Marcus Thorne", role: "Safety Auditor", color: "#8b5cf6" }
        ];
        personas.forEach((p, idx) => {
          const px = 1060 + idx * 240;
          const py = 480;
          ctx.fillStyle = '#161722';
          ctx.fillRect(px, py, 220, 200);
          ctx.strokeStyle = p.color;
          ctx.lineWidth = 2;
          ctx.strokeRect(px, py, 220, 200);

          ctx.fillStyle = p.color;
          ctx.font = 'bold 20px -apple-system, sans-serif';
          ctx.fillText(p.name, px + 110, py + 90);
          ctx.fillStyle = '#a1a1aa';
          ctx.font = '16px -apple-system, sans-serif';
          ctx.fillText(p.role, px + 110, py + 130);
        });
        ctx.textAlign = 'left';
      }
      else if (type === 'trustscan') {
        // TrustScan AI Card & Laser Scan
        ctx.textAlign = 'center';
        ctx.fillStyle = '#06b6d4';
        ctx.font = 'bold 32px monospace';
        ctx.fillText('GEMINI 2.5 FLASH TRUSTSCAN OCR', cx, 260);

        // Certificate Container
        ctx.fillStyle = '#181926';
        ctx.fillRect(1120, 300, 560, 420);
        ctx.strokeStyle = '#06b6d4';
        ctx.lineWidth = 2;
        ctx.strokeRect(1120, 300, 560, 420);

        // Certificate Details
        ctx.fillStyle = '#fafafa';
        ctx.font = 'bold 24px -apple-system, sans-serif';
        ctx.fillText('HAAS CNC LEVEL-2 OPERATOR', cx, 360);

        ctx.fillStyle = '#a1a1aa';
        ctx.font = '18px monospace';
        ctx.fillText('ISSUED TO: Alex Chen (MIT MechE)', cx, 420);
        ctx.fillText('AUTHORITY: MIT Center for Bits & Atoms', cx, 460);
        ctx.fillText('EXPIRATION: 2027-12-31 · ACTIVE', cx, 500);

        // Confidence Badge
        ctx.fillStyle = '#10b981';
        ctx.fillRect(1220, 560, 360, 60);
        ctx.fillStyle = '#000000';
        ctx.font = 'bold 22px monospace';
        ctx.fillText('✓ MATCH CONFIDENCE: 99.2%', cx, 598);

        // Laser scan animation
        const laserY = 320 + ((Math.sin(time * 3) + 1) / 2) * 380;
        ctx.strokeStyle = 'rgba(6, 182, 212, 0.9)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(1120, laserY);
        ctx.lineTo(1680, laserY);
        ctx.stroke();
        ctx.textAlign = 'left';
      }
      else if (type === 'quota') {
        // Quota Radial Gauges
        ctx.textAlign = 'center';
        ctx.fillStyle = '#f59e0b';
        ctx.font = 'bold 32px monospace';
        ctx.fillText('FAIR-SHARE QUOTA ALLOCATION', cx, 280);

        // 2 Gauge dials
        drawGauge(ctx, cx - 180, 520, 100, 0.4, '10h/wk CAP', '4h Used · 6h Avail', '#10b981');
        drawGauge(ctx, cx + 180, 520, 100, 0.35, '40% DEPT CEILING', '35% MechE / 65% Open', '#06b6d4');
        ctx.textAlign = 'left';
      }
      else if (type === 'custody') {
        // QR Code Station Beacon & 4-Point Checklist
        ctx.textAlign = 'center';
        ctx.fillStyle = '#10b981';
        ctx.font = 'bold 32px monospace';
        ctx.fillText('PHYSICAL DISPATCH & BASELINE CAPTURE', cx, 260);

        // Animated QR Beacon
        ctx.fillStyle = '#181926';
        ctx.fillRect(1140, 320, 240, 240);
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 3;
        ctx.strokeRect(1140, 320, 240, 240);

        // Simple QR pattern representation
        ctx.fillStyle = '#fafafa';
        ctx.fillRect(1160, 340, 60, 60);
        ctx.fillRect(1300, 340, 60, 60);
        ctx.fillRect(1160, 480, 60, 60);
        ctx.fillRect(1240, 420, 40, 40);

        // Checkpoints
        const checks = [
          "Emergency Stop Circuit Verified",
          "Workspace Cleared of Swarf & Debris",
          "Eyewear & Interlocks Engaged",
          "2 Baseline Photos Stored in Mongoose"
        ];
        ctx.textAlign = 'left';
        checks.forEach((chk, i) => {
          const cy = 600 + i * 45;
          ctx.fillStyle = '#10b981';
          ctx.font = 'bold 20px monospace';
          ctx.fillText('✓ [VERIFIED]', 1060, cy);
          ctx.fillStyle = '#fafafa';
          ctx.font = '18px -apple-system, sans-serif';
          ctx.fillText(chk, 1220, cy);
        });
      }
      else if (type === 'visionguard') {
        // Split Diff Slider
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 32px monospace';
        ctx.fillText('VISIONGUARD MULTIMODAL AI DIFF SLIDER', cx, 240);

        // Diff comparison box
        const bx = 1060;
        const by = 280;
        const bw = 680;
        const bh = 420;
        ctx.fillStyle = '#181926';
        ctx.fillRect(bx, by, bw, bh);

        // Split line oscillating with time
        const splitPercent = (Math.sin(time * 1.5) + 1) / 2;
        const splitX = bx + splitPercent * bw;

        // Left baseline
        ctx.save();
        ctx.beginPath();
        ctx.rect(bx, by, splitX - bx, bh);
        ctx.clip();
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(bx, by, bw, bh);
        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 24px monospace';
        ctx.fillText('PRE-USE BASELINE', bx + 160, by + 60);
        ctx.restore();

        // Right return with bounding box
        ctx.save();
        ctx.beginPath();
        ctx.rect(splitX, by, bx + bw - splitX, bh);
        ctx.clip();
        ctx.fillStyle = '#27272a';
        ctx.fillRect(bx, by, bw, bh);
        ctx.fillStyle = '#f87171';
        ctx.font = 'bold 24px monospace';
        ctx.fillText('POST-USE RETURN', bx + bw - 160, by + 60);

        // AI Bounding Box on collet
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 3;
        ctx.strokeRect(bx + 260, by + 180, 180, 140);
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 16px monospace';
        ctx.fillText('WEAR [420, 380, 560, 540]', bx + 260, by + 165);
        ctx.restore();

        // Split divider
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(splitX, by);
        ctx.lineTo(splitX, by + bh);
        ctx.stroke();

        // Classification banner
        ctx.fillStyle = '#10b981';
        ctx.fillRect(1160, 720, 480, 55);
        ctx.fillStyle = '#000000';
        ctx.font = 'bold 20px monospace';
        ctx.fillText('AI CLASSIFICATION: NORMAL_WEAR (0.94)', cx, 755);
        ctx.textAlign = 'left';
      }
      else if (type === 'audit') {
        // SHA-256 Block Chain
        ctx.textAlign = 'center';
        ctx.fillStyle = '#10b981';
        ctx.font = 'bold 32px monospace';
        ctx.fillText('IMMUTABLE SHA-256 AUDIT LOG', cx, 280);

        const blocks = [
          { name: "RESERVATION_CONFIRMED", hash: "a8f3b...12d" },
          { name: "TRUSTSCAN_OCR_VERIFIED", hash: "90e4c...88a" },
          { name: "STATION_QR_CHECK_IN", hash: "3c7b1...55f" },
          { name: "VISIONGUARD_INSPECTED", hash: "e29fa...41b" }
        ];

        blocks.forEach((b, i) => {
          const by = 350 + i * 95;
          ctx.fillStyle = '#161722';
          ctx.fillRect(1060, by, 680, 70);
          ctx.strokeStyle = '#10b981';
          ctx.lineWidth = 2;
          ctx.strokeRect(1060, by, 680, 70);

          ctx.fillStyle = '#fafafa';
          ctx.font = 'bold 18px monospace';
          ctx.fillText(`BLOCK 00${i + 1}: ${b.name}`, cx - 60, by + 42);

          ctx.fillStyle = '#06b6d4';
          ctx.font = '16px monospace';
          ctx.fillText(`HASH: ${b.hash}`, cx + 220, by + 42);
        });

        ctx.fillStyle = '#10b981';
        ctx.font = 'bold 24px -apple-system, sans-serif';
        ctx.fillText('100% AUDIT COMPLIANCE · READY FOR JUDGES', cx, 780);
        ctx.textAlign = 'left';
      }
    }

    function drawGauge(ctx, gx, gy, radius, percent, title, subtitle, color) {
      ctx.lineWidth = 18;
      ctx.strokeStyle = '#27272a';
      ctx.beginPath();
      ctx.arc(gx, gy, radius, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = color;
      ctx.beginPath();
      ctx.arc(gx, gy, radius, -Math.PI / 2, Math.PI * percent * 2 - Math.PI / 2);
      ctx.stroke();

      ctx.fillStyle = '#fafafa';
      ctx.font = 'bold 36px -apple-system, sans-serif';
      ctx.fillText(`${Math.round(percent * 100)}%`, gx, gy + 12);

      ctx.font = 'bold 18px monospace';
      ctx.fillStyle = color;
      ctx.fillText(title, gx, gy + radius + 40);

      ctx.font = '14px -apple-system, sans-serif';
      ctx.fillStyle = '#a1a1aa';
      ctx.fillText(subtitle, gx, gy + radius + 70);
    }

    // Start rendering canvas
    render();
  </script>
</body>
